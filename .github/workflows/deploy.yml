name: Deploy PawFinder to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests (QA Audit)
        run: npm run test

      - name: Seed SQLite Database & Export Data
        run: npm run db:seed

      - name: Build Next.js Static Site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /pawfinder

      - name: Ensure .nojekyll Exists
        run: touch ./out/.nojekyll

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
        continue-on-error: true

      - name: Deploy to GitHub Pages Action Environment
        uses: actions/deploy-pages@v4
        continue-on-error: true
